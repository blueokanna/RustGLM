name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (minimal)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            flags: --no-default-features
          - name: default
            flags: ""
          - name: all-features
            flags: --all-features
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --all-targets ${{ matrix.flags }}

  coverage:
    name: Coverage (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate LCOV report
        run: cargo llvm-cov --locked --all-features --all-targets --lcov --output-path lcov.info --fail-under-lines 90
      - name: Write coverage summary
        run: cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - uses: actions/upload-artifact@v5
        with:
          name: rustglm-lcov
          path: |
            lcov.info
            coverage-summary.txt
          if-no-files-found: error

  feature-boundaries:
    name: Feature ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - agents
          - audio
          - batch
          - files
          - images
          - mcp
          - rag
          - realtime
          - tools
          - video
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile isolated feature
        run: cargo check --locked --all-targets --no-default-features --features ${{ matrix.feature }}

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check all features on MSRV
        run: cargo check --locked --all-targets --all-features

  docs-and-package:
    name: Docs and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps
      - name: Run doctests
        run: cargo test --locked --all-features --doc
      - name: Build crates.io package
        run: cargo package --locked
