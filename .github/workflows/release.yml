name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  release:
    name: Verify, package, and release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release_ref
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${MANUAL_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use the form v<semver>, for example v1.0.0: ${release_tag}" >&2
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustglm") | .version')"
          expected_tag="v${package_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match ${expected_tag}." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run release tests
        run: cargo test --locked --all-targets --all-features
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Build crate artifact
        run: cargo package --locked
      - name: Generate SHA-256 checksums
        run: |
          cd target/package
          sha256sum rustglm-*.crate > ../../SHA256SUMS

      - name: Ensure release tag points at the verified commit
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          tag_ref="refs/tags/${RELEASE_TAG}"
          head_commit="$(git rev-parse HEAD)"

          if git show-ref --verify --quiet "${tag_ref}"; then
            tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "Tag ${RELEASE_TAG} points to ${tag_commit}, not verified commit ${head_commit}." >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" -m "RustGLM ${RELEASE_TAG}" "${head_commit}"
            git push origin "${tag_ref}"
          else
            echo "Tag ${RELEASE_TAG} was not fetched for this tag-triggered release." >&2
            exit 1
          fi

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" target/package/rustglm-*.crate SHA256SUMS --clobber
          else
            gh release create "${RELEASE_TAG}" target/package/rustglm-*.crate SHA256SUMS --verify-tag --generate-notes --title "RustGLM ${RELEASE_TAG}"
          fi
