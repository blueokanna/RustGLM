name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  release:
    name: Verify, package, and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Require a version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Manual releases must be run from a v* tag." >&2
            exit 1
          fi

      - name: Verify tag matches Cargo.toml
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustglm") | .version')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${expected_tag}." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run release tests
        run: cargo test --locked --all-targets --all-features
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Build crate artifact
        run: cargo package --locked
      - name: Generate SHA-256 checksums
        run: |
          cd target/package
          sha256sum rustglm-*.crate > ../../SHA256SUMS

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" target/package/rustglm-*.crate SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" target/package/rustglm-*.crate SHA256SUMS --verify-tag --generate-notes --title "RustGLM ${GITHUB_REF_NAME}"
          fi
